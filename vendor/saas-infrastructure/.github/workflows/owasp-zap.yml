name: OWASP ZAP Security Scan

on:
  schedule:
    # Run weekly on Sunday at 2am
    - cron: "0 2 * * 0"
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  issues: write

jobs:
  zap-scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @saas-infra/product-one build

      - name: Start application
        run: |
          pnpm --filter @saas-infra/product-one preview &
          echo $! > .app.pid
          sleep 15
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Wait for application
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:4173; do sleep 2; done'

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:4173"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
          allow_issue_writing: true
          issue_title: "ZAP Security Scan Report"

      - name: Stop application
        if: always()
        run: |
          if [ -f .app.pid ]; then
            kill $(cat .app.pid) || true
          fi

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md

      - name: Create Issue for Findings
        if: failure()
        run: |
          gh issue create \
            --title "🔒 OWASP ZAP Security Findings - $(date +%Y-%m-%d)" \
            --body-file report_md.md \
            --label "security,zap,automated"
        env:
          GH_TOKEN: ${{ github.token }}
