name: Snyk Security Scan

# NOTE: This workflow may generate failure annotations due to:
# 1. Missing SNYK_TOKEN secret (if not configured)
# 2. SARIF upload failing if GitHub Advanced Security is not enabled
# 3. Workflow run telemetry permissions issue
# The workflow will still succeed due to continue-on-error: true.
# To resolve: Configure SNYK_TOKEN secret + enable GitHub Advanced Security (paid features).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 4am
    - cron: "0 4 * * *"

jobs:
  snyk:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-projects --detection-depth=6 --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk.sarif
