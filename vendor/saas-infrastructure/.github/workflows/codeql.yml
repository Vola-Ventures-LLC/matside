name: "CodeQL Security Scan"

# NOTE: This workflow runs CodeQL analysis but may generate failure annotations
# if GitHub Advanced Security is not enabled. The workflow will still succeed
# due to continue-on-error: true, but you may receive email notifications.
# To resolve: Enable GitHub Advanced Security in repo settings (paid feature).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 2am
    - cron: "0 2 * * 1"

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use security-and-quality query suite for comprehensive analysis
          queries: security-and-quality
          # Increase timeout for large monorepo
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.spec.ts'

      - name: Build packages for analysis
        run: pnpm turbo build --filter="!@saas-infra/product-one"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"
