name: Weekly Security Report

on:
  schedule:
    # Run every Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  issues: write

jobs:
  generate-report:
    name: Generate Security Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Dependabot alerts
        id: dependabot
        run: |
          ALERTS=$(gh api /repos/${{ github.repository }}/dependabot/alerts \
            --jq 'map(select(.state == "open")) | length')
          echo "count=$ALERTS" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get CodeQL alerts
        id: codeql
        run: |
          ALERTS=$(gh api /repos/${{ github.repository }}/code-scanning/alerts \
            --jq 'map(select(.state == "open")) | length')
          echo "count=$ALERTS" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate report
        run: |
          cat > security-report.md << 'EOF'
          # Weekly Security Report

          **Generated:** $(date +%Y-%m-%d)

          ## Summary

          - **Dependabot Alerts:** ${{ steps.dependabot.outputs.count }} open
          - **Code Scanning Alerts:** ${{ steps.codeql.outputs.count }} open

          ## Action Items

          ### Critical Priority
          - Review and fix high/critical Dependabot alerts
          - Address code scanning errors

          ### This Week
          - Merge approved Dependabot PRs
          - Review Semgrep findings
          - Check CodeQL quality suggestions

          ## Resources

          - [Dependabot Alerts](https://github.com/${{ github.repository }}/security/dependabot)
          - [Code Scanning](https://github.com/${{ github.repository }}/security/code-scanning)
          - [Security Overview](https://github.com/${{ github.repository }}/security)

          ---
          *Automated report generated by GitHub Actions*
          EOF

      - name: Create issue
        run: |
          gh issue create \
            --title "Security Report - $(date +%Y-%m-%d)" \
            --body-file security-report.md \
            --label "security,automated"
        env:
          GH_TOKEN: ${{ github.token }}
