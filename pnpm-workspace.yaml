packages:
  - "."
  - "vendor/saas-infrastructure/packages/*"

catalog:
  # Core dependencies (must match vendor/saas-infrastructure catalog)
  react: ^18.3.1
  react-dom: ^18.3.1
  react-router-dom: ^6.30.1

  # Supabase
  "@supabase/supabase-js": ^2.94.0

  # State management & data fetching
  "@tanstack/react-query": ^5.83.0

  # UI & icons
  lucide-react: ^0.462.0
  next-themes: ^0.3.0
  sonner: ^1.7.4

  # Utilities
  date-fns: ^3.6.0
  clsx: ^2.1.1
  tailwind-merge: ^2.6.0
  dompurify: ^3.3.1
  zod: ^3.25.76

  # Rich text editor (used by @saas-infra/content)
  "@tiptap/react": ^3.18.0
  "@tiptap/starter-kit": ^3.18.0
  "@tiptap/extension-heading": ^3.18.0
  "@tiptap/extension-image": ^3.18.0
  "@tiptap/extension-link": ^3.18.0

  # Markdown (used by @saas-infra/content)
  react-markdown: ^10.1.0
  rehype-raw: ^7.0.0

  # Charts
  recharts: ^2.15.4

  # PDF generation (used by @saas-infra packages)
  jspdf: ^4.1.0

  # Forms
  "@hookform/resolvers": ^3.10.0
  react-hook-form: ^7.71.1

  # Development dependencies
  typescript: ^5.8.3
  "@types/react": ^18.3.23
  "@types/react-dom": ^18.3.7
  "@types/node": ^22.16.5
  "@types/dompurify": ^3.0.5

  # SEO
  react-helmet-async: ^2.0.4
